# Same routing as deploy/docker/nginx.conf, except proxy_pass targets the
# Windows host's own loopback (where the backend runs natively — see
# install-native-backend.ps1) instead of a "backend" container, since the
# backend isn't containerized in this hybrid mode (it needs direct access
# to a local WebSphere Java install for FileNet content-write support).
server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://host.docker.internal:8020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
