# Reverse proxy + static SPA host for C-ECM. Two rules, deliberately not
# one per backend router: /api/ forwards everything to the backend with
# the prefix stripped (proxy_pass's trailing slash does the stripping), so
# a new backend route added later needs no matching change here. Everything
# else falls through to the built SPA, with try_files' fallback to
# index.html so client-side routing (a refresh on /files/some-id) doesn't
# 404 at the web server.
server {
    listen 80;
    server_name _;

    # File uploads: match the backend's own FD_MAX_UPLOAD_BYTES default
    # (500MB) -- nginx's default (1MB) would otherwise reject a large
    # upload before it ever reaches the backend to apply its own limit.
    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://backend:8020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads/downloads and a slow AI backend call both need more
        # than nginx's 60s default before it gives up on the backend.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
